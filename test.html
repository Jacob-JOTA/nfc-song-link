<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening Music...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.1);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border-left-color: #1db954;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    p {
      color: #a0a0a0;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Loading your track...</h2>
  <p id="status">Checking Spotify...</p>

  <script>
    window.onload = function() {
      const spotifyUri     = "spotify:track:1gihuPhrLraKYrJMAEONyc";
      const appleMusicUri  = "music://music.apple.com/au/song/feel-so-close-radio-edit/450132719";
      const amazonMusicUri = "https://amazon.co.uk/music/player/albums/B009NMB72Q?marketplaceId=A1F83G8C2ARO7P&musicTerritory=GB&ref=dm_sh_a3BeOgSdsYqXiLIS3Bg2qmAg6&trackAsin=B009NMB81Q";
      const youtubeFallback= "https://www.youtube.com/watch?v=dGghkjpNCQ8";

      let appOpened = false;

      window.addEventListener("blur", function() {
        appOpened = true;
      });

      if (spotifyUri) {
        window.location.href = spotifyUri;
      }

      setTimeout(function() {
        if (appOpened || !appleMusicUri) return;
        document.getElementById("status").innerText = "Checking Apple Music...";
        window.location.href = appleMusicUri;
      }, 1200);

      setTimeout(function() {
        if (appOpened || !amazonMusicUri) return;
        document.getElementById("status").innerText = "Checking Amazon Music...";
        window.location.href = amazonMusicUri;
      }, 2400);

      setTimeout(function() {
        if (!appOpened) {
          document.getElementById("status").innerText = "Opening YouTube...";
          window.location.href = youtubeFallback;
        }
      }, 3600);
    };
  </script>
</body>
</html>
